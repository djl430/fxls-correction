el\">◉ 均衡模式⌄\u003c/span>\n                  \u003cbutton class=\"voice-button\" aria-label=\"语音输入\">♩\u003c/button>\n                  \u003cbutton class=\"send-button\" id=\"sendButton\" aria-label=\"发送\" disabled>↑\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cinput id=\"fileInput\" type=\"file\" accept=\"image/jpeg,image/png,image/webp,.csv,.xlsx\" multiple hidden>\n            \u003cp class=\"upload-hint\" id=\"uploadHint\" hidden>支持 JPG、PNG、WEBP；学生名册支持 CSV、XLSX\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003csection class=\"resource-section\">\n          \u003cdiv class=\"resource-tabs\">\u003cbutton class=\"active\">资源广场\u003c/button>\u003cbutton>应用广场\u003c/button>\u003c/div>\n          \u003cdiv class=\"resource-grid\">\n            \u003carticle class=\"resource-card dark\">\u003cdiv>\u003csmall>飞象老师\u003c/small>\u003ch3>「教育应用」\u003cbr>新手引导\u003c/h3>\u003cspan>点击了解更多　→\u003c/span>\u003c/div>\u003cfooter>\u003cb>飞象老师“教育应用”新手指南\u003c/b>\u003csmall>教育应用 · 新手入门\u003c/small>\u003c/footer>\u003c/article>\n            \u003carticle class=\"resource-card mint\">\u003cdiv>\u003csmall>飞象老师®\u003c/small>\u003ch3>AI工作坊\u003c/h3>\u003cspan>点击预约直播　→\u003c/span>\u003c/div>\u003cfooter>\u003cb>飞象老师AI工作坊直播预约\u003c/b>\u003csmall>AI工作坊 · 教师成长\u003c/small>\u003c/footer>\u003c/article>\n            \u003carticle class=\"resource-card yellow\">\u003cdiv>\u003ch3>玩转互动课件\u003cbr>必看小技巧\u003c/h3>\u003cspan>点击了解更多　→\u003c/span>\u003c/div>\u003cfooter>\u003cb>【玩转互动课件】必看小技巧\u003c/b>\u003csmall>互动课件 · 实用技巧\u003c/small>\u003c/footer>\u003c/article>\n            \u003carticle class=\"resource-card pale\">\u003cdiv>\u003ch3>玩转数据回收\u003cbr>案例合集\u003c/h3>\u003cspan>点击了解更多　→\u003c/span>\u003c/div>\u003cfooter>\u003cb>【数据回收】新手指引\u003c/b>\u003csmall>数据回收 · 教学反馈\u003c/small>\u003c/footer>\u003c/article>\n          \u003c/div>\n        \u003c/section>\n      \u003c/section>\n\n      \u003csection class=\"task-view\" id=\"taskView\" hidden>\n        \u003cheader class=\"task-header\">\n          \u003cdiv>\u003ch1>AI智批\u003c/h1>\u003cspan>静态演示 · 虚构数据 · 原卷留痕\u003c/span>\u003c/div>\n          \u003cbutton id=\"backHomeButton\">返回首页\u003c/button>\n        \u003c/header>\n        \u003cdiv class=\"task-workspace\" id=\"taskWorkspace\">\n          \u003cdiv class=\"task-left\">\n            \u003cdiv class=\"message-scroll\">\n              \u003cdiv class=\"message-column\">\n                \u003cdiv class=\"user-message\" id=\"userMessage\">\u003c/div>\n                \u003csection class=\"agent-block\" id=\"jobProgress\">\n                  \u003cdiv class=\"agent-avatar\">象\u003c/div>\n                  \u003cdiv class=\"agent-content\">\n                    \u003ch2 id=\"progressTitle\">正在读取作业与名册\u003c/h2>\n                    \u003cp id=\"progressDescription\">我会先整理上传内容，再调用作业批改 skill。\u003c/p>\n                    \u003cdiv class=\"stage-list\" id=\"stageList\">\u003c/div>\n                  \u003c/div>\n                \u003c/section>\n                \u003csection class=\"result-block\" id=\"resultSummary\" hidden>\n                  \u003cdiv class=\"result-heading\">\u003ch2>批改结果\u003c/h2>\u003c/div>\n                  \u003cdiv class=\"result-table-wrap\">\n                    \u003ctable class=\"result-table\">\n                      \u003cthead>\u003ctr>\u003cth>作业/试卷\u003c/th>\u003cth>提交人数\u003c/th>\u003cth>待批改作答\u003c/th>\u003cth>推荐复核作答\u003c/th>\u003cth>作答正确率\u003c/th>\u003c/tr>\u003c/thead>\n                      \u003ctbody id=\"resultTableBody\">\u003c/tbody>\n                    \u003c/table>\n                  \u003c/div>\n                  \u003csection class=\"result-section\" id=\"attentionSection\">\n                    \u003ch3>需要关注\u003c/h3>\n                    \u003cul class=\"attention-list\" id=\"attentionList\">\u003c/ul>\n                    \u003cdiv class=\"result-errors\" id=\"resultErrors\" hidden>\u003c/div>\n                  \u003c/section>\n                  \u003csection class=\"result-section review-result-section\">\n                    \u003ch3>查看批改结果\u003c/h3>\n                    \u003cdiv class=\"review-links\" id=\"reviewLinks\">\u003c/div>\n                  \u003c/section>\n                \u003c/section>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"task-composer-host\" id=\"taskComposerHost\">\u003c/div>\n          \u003c/div>\n          \u003caside class=\"review-pane\" id=\"reviewPane\" aria-label=\"作业批改复核区\" hidden>\n            \u003cheader class=\"review-pane-header\">\n              \u003cstrong id=\"reviewPaneTitle\">批改复核\u003c/strong>\n              \u003cbutton id=\"closeReviewButton\" aria-label=\"关闭复核页\">×\u003c/button>\n            \u003c/header>\n            \u003cdiv class=\"review-loading\" id=\"reviewLoading\">正在加载复核页…\u003c/div>\n            \u003ciframe id=\"reviewFrame\" title=\"作业批改复核页\" src=\"about:blank\">\u003c/iframe>\n          \u003c/aside>\n        \u003c/div>\n      \u003c/section>\n    \u003c/main>\n  \u003c/div>\n\n  \u003csection class=\"modal-layer\" id=\"introModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"introTitle\" hidden>\n    \u003cdiv class=\"intro-modal\">\n      \u003cheader class=\"modal-top\">\u003cspan>教学技能 / AI智批\u003c/span>\u003cbutton id=\"modalClose\" aria-label=\"关闭\">×\u003c/button>\u003c/header>\n      \u003cdiv class=\"intro-grid\">\n        \u003cdiv class=\"intro-copy\">\n          \u003ch2 id=\"introTitle\">AI智批\u003c/h2>\n          \u003cp class=\"intro-lead\">上传任意学科的作业图片，AI 自动识别学生作答并判断对错，把批改痕迹直接保留在原作业上。\u003c/p>\n          \u003cul class=\"capability-list\">\n            \u003cli>\u003cspan>✓\u003c/span>\u003cp>支持任意学科作业，单张或批量上传都能批。\u003c/p>\u003c/li>\n            \u003cli>\u003cspan>✓\u003c/span>\u003cp>对错标记直接留在学生原作业上。\u003c/p>\u003c/li>\n            \u003cli>\u003cspan>✓\u003c/span>\u003cp>自动汇总班级、学生和题目正确率。\u003c/p>\u003c/li>\n            \u003cli>\u003cspan>✓\u003c/span>\u003cp>老师可在复核页点击作答随时改判。\u003c/p>\u003c/li>\n          \u003c/ul>\n          \u003cbutton class=\"start-button\" id=\"startUsingButton\">开始使用 \u003cspan>→\u003c/span>\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"intro-visual\">\n          \u003cdiv class=\"paper-scene\">\n            \u003cdiv class=\"worksheet\">\n              \u003ch3>三年级数学作业\u003c/h3>\n              \u003cdiv class=\"student-line\">班级：三（2）班　 姓名：李明轩　 学号：15\u003c/div>\n              \u003ch4>一、直接写出得数。\u003c/h4>\n              \u003cdiv class=\"math-grid\">\n                \u003cspan>32+18＝\u003cu>50\u003c/u>\u003ci class=\"mark pass\">✓\u003c/i>\u003c/span>\n                \u003cspan>45−27＝\u003cu>18\u003c/u>\u003ci class=\"mark pass\">✓\u003c/i>\u003c/span>\n                \u003cspan>60×3＝\u003cu>180\u003c/u>\u003ci class=\"mark pass\">✓\u003c/i>\u003c/span>\n                \u003cspan>84÷2＝\u003cu>48\u003c/u>\u003ci class=\"mark fail\">×\u003c/i>\u003c/span>\n                \u003cspan>96÷3＝\u003cu>32\u003c/u>\u003ci class=\"mark pass\">✓\u003c/i>\u003c/span>\n                \u003cspan>63+37＝\u003cu>100\u003c/u>\u003ci class=\"mark pass\">✓\u003c/i>\u003c/span>\n              \u003c/div>\n              \u003ch4>二、用竖式计算。\u003c/h4>\n              \u003cdiv class=\"work-lines\">\u003cspan>46 + 378\u003cbr>\u003cu>　424　\u003c/u>\u003ci class=\"mark pass\">✓\u003c/i>\u003c/span>\u003cspan>23 × 14\u003cbr>\u003cu>　322　\u003c/u>\u003ci class=\"mark fail\">×\u003c/i>\u003c/span>\u003c/div>\n              \u003ch4>三、解决问题。\u003c/h4>\n              \u003cp>学校买来 24 盒彩色粉笔，每盒 12 支。一共买来多少支？\u003c/p>\n              \u003cp class=\"handwriting\">24 × 12 = 288（支） \u003ci class=\"mark pass\">✓\u003c/i>\u003c/p>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n  \u003cscript>// Purely fictional product walkthrough. No network or student files are read.\nconst $=s=>document.querySelector(s);\nlet timer,seen=false;\nconst steps=['正在读取作业材料','正在调用 AI 批改（工具调用）','正在批改 1/2 页','正在批改 2/2 页','正在识别样卷','正在匹配学生与作业','正在汇总批改结果','正在生成复核页'];\nfunction home(){clearInterval(timer);$('#taskView').hidden=true;$('#homeView').hidden=false;$('#homeComposerHost').append($('#composerDock'));$('#composerDock').classList.remove('task-composer');}\nfunction activate(){ $('#introModal').hidden=true;$('#skillChip').hidden=false;$('#composerInput').value='请帮我批改这两位学生的作业，在原卷标注对错，并按作业生成复核页。';$('#sendButton').disabled=false;$('#uploadHint').hidden=false;$('#uploadHint').textContent='静态演示 · 使用虚构示例，无需上传文件，不调用真实接口';}\nfunction closeReview(){$('#reviewPane').hidden=true;$('#taskWorkspace').classList.remove('review-open');}\nfunction review(i){$('#reviewPane').hidden=false;$('#taskWorkspace').classList.add('review-open');$('#reviewPaneTitle').textContent=['A卷 · 计算练习','B卷 · 应用练习'][i];$('#reviewLoading').hidden=true;$('#reviewFrame').srcdoc=`\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cstyle>body{font:16px/1.8 sans-serif;padding:24px;background:#f5f5f8;color:#243b33}button{padding:9px 16px;border:1px solid #ddd;border-radius:8px;cursor:pointer}section{padding:24px;background:white;margin:18px 0;border-radius:14px}.answer{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:16px}small{color:#777}\u003c/style>\u003ch2>${['A卷 · 计算练习','B卷 · 应用练习'][i]}\u003c/h2>\u003csmall>虚构数据 · 仅说明复核交互；不代表真实批改结果\u003c/small>\u003csection>提交人数：2　待批改：0　\u003cspan id=\"rate\">\u003c/span>\u003c/section>\u003cbutton onclick=\"document.getElementById('mode').textContent='按题查看：第 1 题'\">按题查看\u003c/button> \u003cbutton onclick=\"document.getElementById('mode').textContent='按学生查看：学生甲、学生乙'\">按学生查看\u003c/button>\u003csection>\u003ch3 id=\"mode\">按题查看：第 1 题\u003c/h3>\u003cdiv class=\"answer\">学生甲　${i?'每盒 6 支，4 盒共 24 支':'32 + 18 = 50'} \u003cbutton onclick=\"toggle(this)\">✓ 正确\u003c/button>\u003c/div>\u003cdiv class=\"answer\">学生乙　${i?'每盒 6 支，4 盒共 20 支':'32 + 18 = 40'} \u003cbutton onclick=\"toggle(this)\">× 错误\u003c/button>\u003c/div>\u003csmall>点击判断可模拟老师改判\u003c/small>\u003c/section>\u003cbutton onclick=\"download()\">下载当前演示结果\u003c/button>\u003cp>\u003csmall>静态版改判仅在当前页面有效；本地文件持续同步为产品设计说明。\u003c/small>\u003c/p>\u003cscript>function update(){let n=[...document.querySelectorAll('.answer button')].filter(b=>b.textContent.includes('正确')).length;document.getElementById('rate').textContent='作答正确率：'+n*50+'%'}function toggle(b){b.textContent=b.textContent.includes('正确')?'× 错误':'✓ 正确';update()}function download(){let u=URL.createObjectURL(new Blob(['\u003c!doctype html>'+document.documentElement.outerHTML],{type:'text/html'}));let a=document.createElement('a');a.href=u;a.download='虚构示例复核结果.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}update()\u003c\\/script>`;}\nfunction task(){ $('#homeView').hidden=true;$('#taskView').hidden=false;$('#taskComposerHost').append($('#composerDock'));$('#composerDock').classList.add('task-composer');$('#userMessage').textContent=$('#composerInput').value||'请批改这些作业，并按样卷汇总结果、生成复核页。';$('#jobProgress').hidden=false;$('#skillChip').hidden=false;$('#sendButton').disabled=false;}\nfunction rows(n){$('#stageList').innerHTML=steps.slice(0,n).map(s=>'\u003cdiv class=\"stage-row done\">\u003cspan class=\"stage-dot\">✓\u003c/span>\u003cb>'+s+'\u003c/b>\u003c/div>').join('');}\nfunction result(){clearInterval(timer);task();rows(steps.length);$('#progressTitle').textContent='批改完成';$('#progressDescription').textContent='虚构示例结果 · 用于说明产品流程';$('#resultSummary').hidden=false;$('#resultTableBody').innerHTML=['A卷 · 计算练习','B卷 · 应用练习'].map(n=>'\u003ctr>\u003ctd>'+n+'\u003c/td>\u003ctd>2 人\u003c/td>\u003ctd>0 项\u003c/td>\u003ctd>1 项\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>').join('');$('#attentionList').innerHTML='\u003cli>示例：有作答建议老师复核。\u003c/li>';$('#reviewLinks').innerHTML='';['A卷 · 计算练习','B卷 · 应用练习'].forEach((n,i)=>{let row=document.createElement('div');row.className='review-link-row';row.innerHTML='\u003cspan>'+n+' · 2 人\u003c/span>\u003cbutton class=\"review-link-button\">打开复核页\u003c/button>';row.querySelector('button').onclick=()=>review(i);$('#reviewLinks').append(row)});}\nfunction run(){clearInterval(timer);task();closeReview();$('#resultSummary').hidden=true;let n=0;rows(0);timer=setInterval(()=>{rows(++n);$('#progressTitle').textContent=steps[n-1];$('#progressDescription').textContent='正在播放模拟执行过程';if(n===steps.length)result()},600);}\nwindow.staticNavigate=s=>{if(s==='home')home();else if(s==='intro'){home();$('#introModal').hidden=false}else if(s==='compose'){home();activate()}else {result();if(s==='review')review(0)}};\n$('#aiCorrectionCard').onclick=()=>{if(!seen){$('#introModal').hidden=false;seen=true}else activate()};$('#modalClose').onclick=()=>$('#introModal').hidden=true;$('#startUsingButton').onclick=activate;$('#backHomeButton').onclick=home;$('#newTaskButton').onclick=home;$('#closeReviewButton').onclick=closeReview;$('#sendButton').onclick=run;$('#addButton').onclick=()=>{$('#attachmentList').hidden=false;$('#attachmentList').textContent='示例作业甲.png　示例作业乙.png（虚构占位，不读取文件）';activate()};home();\n\u003c/script>\n\n\u003cscript id=\"html-annotation-project-data\" type=\"application/json\">{\"version\":1,\"fileName\":\"AI智批产品标注.html\",\"html\":\"\\u003c!doctype html>\\n\\u003chtml lang=\\\"zh-CN\\\">\\n\\u003chead>\\u003cbase href=\\\"/\\\">\\n  \\u003cmeta charset=\\\"UTF-8\\\">\\n  \\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\\n  \\u003cmeta name=\\\"theme-color\\\" content=\\\"#ffffff\\\">\\n  \\u003ctitle>飞象老师｜AI 智批演示\\u003c/title>\\n  \\u003clink rel=\\\"stylesheet\\\" href=\\\"/styles.css\\\">\\n\\u003c/head>\\n\\u003cbody>\\n  \\u003cdiv class=\\\"demo-badge\\\">demo演示\\u003c/div>\\n  \\u003cdiv class=\\\"app-shell\\\">\\n    \\u003caside class=\\\"sidebar\\\">\\n      \\u003cheader class=\\\"brand-row\\\">\\n        \\u003cimg src=\\\"/assets/logo.svg\\\" alt=\\\"飞象老师\\\">\\n        \     const name = rootNameForElement(element);\n                const isSemanticRoot = element.tagName === \"MAIN\" || element.tagName === \"SECTION\" || element.tagName === \"ARTICLE\" || role === \"main\";\n                const isNamedRoot = /(^|[\\s_-])(page|screen|view|route|scene|panel|content|detail|list|home|dashboard)([\\s_-]|$)/.test(name);\n                return isSemanticRoot || isNamedRoot;\n            }\n\n            function pageRootScore(element) {\n                const name = rootNameForElement(element);\n                let score = 0;\n                if (/(^|[\\s_-])(active|current|selected|show|open)([\\s_-]|$)/.test(name)) {\n                    score += 80;\n                }\n                if (/(^|[\\s_-])(page|screen|view|route|scene|panel)([\\s_-]|$)/.test(name)) {\n                    score += 45;\n                }\n                if (/(^|[\\s_-])(content|detail|list|home|dashboard)([\\s_-]|$)/.test(name)) {\n                    score += 25;\n                }\n                const role = (element.getAttribute(\"role\") || \"\").toLowerCase();\n                if (element.tagName === \"MAIN\" || role === \"main\") {\n                    score += 30;\n                }\n                if (element.tagName === \"SECTION\" || element.tagName === \"ARTICLE\") {\n                    score += 15;\n                }\n                const fingerprint = visibleTextFingerprint(element);\n                if (fingerprint) {\n                    score += 5;\n                }\n                const rect = element.getBoundingClientRect();\n                if (rect.width > 0 && rect.height > 0) {\n                    const viewportArea = Math.max(1, window.innerWidth * window.innerHeight);\n                    const areaRatio = Math.min(1, (rect.width * rect.height) / viewportArea);\n                    score += Math.round(areaRatio * 10);\n                }\n                return score;\n            }\n\n            function activePageRoot() {\n                const selectors = [\n                    \"main\", \"section\", \"article\", \"[role='main']\",\n                    \"[data-page]\", \"[data-screen]\", \"[data-view]\", \"[data-route]\",\n                    \"[id*='page']\", \"[class*='page']\",\n                    \"[id*='screen']\", \"[class*='screen']\",\n                    \"[id*='view']\", \"[class*='view']\",\n                    \"[id*='route']\", \"[class*='route']\",\n                    \"[id*='scene']\", \"[class*='scene']\",\n                    \"[id*='panel']\", \"[class*='panel']\",\n                    \"[id*='content']\", \"[class*='content']\",\n                    \"[id*='detail']\", \"[class*='detail']\",\n                    \"[id*='list']\", \"[class*='list']\",\n                    \"[id*='home']\", \"[class*='home']\",\n                    \"[id*='dashboard']\", \"[class*='dashboard']\"\n                ].join(\",\");\n                let best = null;\n                let bestScore = -1;\n                let nodes = [];\n                try {\n                    nodes = Array.from(document.querySelectorAll(selectors));\n                } catch (error) {\n                    nodes = [];\n                }\n                nodes.forEach(function (node) {\n                    if (!isPageRootCandidate(node)) {\n                        return;\n                    }\n                    const score = pageRootScore(node);\n                    if (score > bestScore) {\n                        best = node;\n                        bestScore = score;\n                    }\n                });\n                return best;\n            }\n\n            function hasFixedAncestor(element) {\n                let node = element;\n                while (node && node.nodeType === 1 && node !== document.documentElement) {\n                    if (window.getComputedStyle(node).position === \"fixed\") {\n                        return true;\n                    }\n                    node = node.parentElement;\n                }\n                return false;\n            }\n\n            function hasStrongPageIdentity(root, path) {\n                if (!root || !path || root === document.body || root === document.documentElement) {\n                    return false;\n                }\n                if (root.getAttribute(\"data-page\") || root.getAttribute(\"data-screen\") || root.getAttribute(\"data-view\") || root.getAttribute(\"data-route\")) {\n                    return true;\n                }\n                const id = (root.id || \"\").toLowerCase();\n                return /(^|[\\s_-])(page|screen|view|route|scene|panel|step)([\\s_-]|\\d|$)/.test(id);\n            }\n\n            function pageRootForElement(element) {\n                const ambientRoot = activePageRoot();\n                if (!element || element === document.body || element === document.documentElement) {\n                    return ambientRoot || document.body || document.documentElement;\n                }\n                const overlay = overlayRootForElement(element);\n                if (overlay) {\n                    return overlay;\n                }\n                if (ambientRoot && element.contains && element.contains(ambientRoot)) {\n                    return ambientRoot;\n                }\n                if (hasFixedAncestor(element) && ambientRoot) {\n                    return ambientRoot;\n                }\n                if (!element || element === document.documentElement) {\n                    return document.body || document.documentElement;\n                }\n                let candidate = null;\n                let node = element;\n                while (node && node.nodeType === 1 && node !== document.documentElement) {\n                    const role = (node.getAttribute(\"role\") || \"\").toLowerCase();\n                    const name = [\n                        node.id || \"\",\n                        node.className || \"\",\n                        node.getAttribute(\"data-page\") || \"\",\n                        node.getAttribute(\"data-screen\") || \"\",\n                        node.getAttribute(\"data-view\") || \"\",\n                        node.getAttribute(\"data-route\") || \"\"\n                    ].join(\" \").toLowerCase();\n                    const isSemanticRoot = node.tagName === \"MAIN\" || node.tagName === \"SECTION\" || node.tagName === \"ARTICLE\" || role === \"main\";\n                    const isNamedRoot = /(^|[\\s_-])(page|screen|view|route|scene|panel|content|detail|list|home|dashboard)([\\s_-]|$)/.test(name);\n                    if ((isSemanticRoot || isNamedRoot) && isElementVisible(node)) {\n                        candidate = node;\n                    }\n                    node = node.parentElement;\n                }\n                if (candidate) {\n                    return candidate;\n                }\n                let top = element;\n                while (top && top.parentElement && top.parentElement !== document.body) {\n                    top = top.parentElement;\n                }\n                return (top && top !== document.documentElement && isElementVisible(top)) ? top : (document.body || document.documentElement);\n            }\n\n            function pageContextForElement(element) {\n                const root = pageRootForElement(element);\n                return {\n                    route: routeKey(),\n                    rootPath: cssPathForElement(root),\n                    rootFingerprint: visibleTextFingerprint(root),\n                    local: localContextForElement(element, root),\n                    overlay: overlayContextForElement(element)\n                };\n            }\n\n            function pageContextMatches(context) {\n                if (!context) {\n                    return pageContextOverlayMatches(context);\n                }\n                if (context.route && context.route !== routeKey()) {\n                    return false;\n                }\n                if (!pageContextOverlayMatches(context)) {\n                    return false;\n                }\n                let root = document.body || document.documentElement;\n                if (context.rootPath) {\n                    try {\n                        root = document.querySelector(context.rootPath);\n                    } catch (error) {\n                        root = null;\n                    }\n                }\n                if (!root || !isElementVisible(root)) {\n                    return false;\n                }\n                const currentRootFingerprint = visibleTextFingerprint(root);\n                if (!hasStrongPageIdentity(root, context.rootPath) && context.rootFingerprint && currentRootFingerprint && context.rootFingerprint !== currentRootFingerprint) {\n                    return false;\n                }\n                if (context.local && context.local.path) {\n                    let localRoot = null;\n                    try {\n                        localRoot = document.querySelector(context.local.path);\n                    } catch (error) {\n                        localRoot = null;\n                    }\n                    if (!localRoot || !isElementVisible(localRoot)) {\n                        return false;\n                    }\n                    const currentLocalFingerprint = visibleTextFingerprint(localRoot);\n                    if (context.local.fingerprint && currentLocalFingerprint && context.local.fingerprint !== currentLocalFingerprint) {\n                        return false;\n                    }\n                }\n                return true;\n            }\n\n            function elementAtNote(note) {\n                const point = hitTestPoint(note);\n                if (point.x \u003c 0 || point.y \u003c 0 || point.x > window.innerWidth || point.y > window.innerHeight) {\n                    return null;\n                }\n                const hidden = [];\n                layer.querySelectorAll(\".html-annotation-export-pin, .html-annotation-export-box\").forEach(function (node) {\n                    hidden.push([node, node.style.pointerEvents, node.style.visibility]);\n                    node.style.pointerEvents = \"none\";\n                    node.style.visibility = \"hidden\";\n                });\n                tooltip.style.pointerEvents = \"none\";\n                tooltip.style.visibility = \"hidden\";\n                const found = document.elementFromPoint(point.x, point.y);\n                hidden.forEach(function (entry) {\n                    entry[0].style.pointerEvents = entry[1];\n                    entry[0].style.visibility = entry[2];\n                });\n                tooltip.style.visibility = \"\";\n                return found;\n            }\n\n            function isCovered(note) {\n                if (note.anchorPath) {\n                    if (!pageContextMatches(note.pageContext)) {\n                        return true;\n                    }\n                    const layout = noteLayout(note);\n                    const source = layout.source;\n                    if (!source || !isElementVisible(source)) {\n                        return true;\n                    }\n                    const top = elementAtNote(note);\n                    if (!top) {\n                        return false;\n                    }\n                    if (top === source || source.contains(top) || top.contains(source)) {\n                        return false;\n                    }\n                    const topOverlay = overlayRootForElement(top);\n                    const sourceOverlay = overlayRootForElement(source);\n                    return Boolean(topOverlay && topOverlay !== sourceOverlay);\n                }\n                if (!pageContextMatches(note.pageContext)) {\n                    return true;\n                }\n                const top = elementAtNote(note);\n                if (!top) {\n                    return false;\n                }\n                const topOverlay = overlayRootForElement(top);\n                const expectedOverlay = note.pageContext && Object.prototype.hasOwnProperty.call(note.pageContext, \"overlay\")\n                    ? note.pageContext.overlay\n                    : null;\n                if (!expectedOverlay) {\n                    return Boolean(topOverlay);\n                }\n                return Boolean(topOverlay && expectedOverlay.path && cssPathForElement(topOverlay) !== expectedOverlay.path);\n            }\n\n            function place(node, note, isPoint) {\n                node.style.position = cssPosition(note);\n                const layout = noteLayout(note);\n                node.style.left = layout.viewportX + \"px\";\n                node.style.top = layout.viewportY + \"px\";\n                if (isPoint) {\n                    node.style.transform = \"translate(-50%, -50%)\";\n                }\n            }\n\n            function placeEntry(entry) {\n                place(entry.pin, entry.note, true);\n                if (entry.box) {\n                    place(entry.box, entry.note, false);\n                    const layout = noteLayout(entry.note);\n                    const size = noteBoxSize(entry.note, layout);\n                    entry.box.style.width = size.width + \"px\";\n                    entry.box.style.height = size.height + \"px\";\n                }\n            }\n\n            let activeTooltipAnchor = null;\n\n            function showTooltip(note, index, anchor) {\n                const title = note.title || \"未命名标注\";\n                const type = note.type || \"交互\";\n                const desc = note.description || \"暂无说明\";\n                activeTooltipAnchor = anchor;\n                tooltip.innerHTML =\n                    '\u003cspan class=\"html-annotation-export-meta\">#' + (index + 1) + \" · \" + escapeHtml(type) + \"\u003c/span>\" +\n                    '\u003cstrong class=\"html-annotation-export-title\">' + escapeHtml(title) + \"\u003c/strong>\" +\n                    '\u003cdiv class=\"html-annotation-export-desc\">' + escapeHtml(desc).replace(/\\n/g, \"\u003cbr>\") + \"\u003c/div>\";\n                tooltip.classList.add(\"show\");\n                positionTooltip(anchor);\n            }\n\n            function positionTooltip(anchor) {\n                const rect = anchor.getBoundingClientRect();\n                const maxWidth = Math.min(360, window.innerWidth - 24);\n                tooltip.style.maxWidth = maxWidth + \"px\";\n\n                let left = rect.left + rect.width / 2;\n                left = Math.max(12 + maxWidth / 2, Math.min(window.innerWidth - 12 - maxWidth / 2, left));\n\n                let top = rect.bottom + 10;\n                const height = tooltip.offsetHeight || 120;\n                if (top + height > window.innerHeight - 12) {\n                    top = Math.max(12, rect.top - height - 10);\n                }\n\n                tooltip.style.left = left + \"px\";\n                tooltip.style.top = top + \"px\";\n            }\n\n            function hideTooltip() {\n                activeTooltipAnchor = null;\n                tooltip.classList.remove(\"show\");\n            }\n\n            function bindTooltip(node, note, index) {\n                node.setAttribute(\"aria-label\", \"#\" + (index + 1) + \" \" + (note.type || \"交互\") + \"：\" + (note.title || \"未命名标注\"));\n                node.addEventListener(\"mouseenter\", function () { showTooltip(note, index, node); });\n                node.addEventListener(\"focus\", function () { showTooltip(note, index, node); });\n                node.addEventListener(\"mouseleave\", hideTooltip);\n                node.addEventListener(\"blur\", hideTooltip);\n            }\n\n            const entries = [];\n            annotations.forEach(function (note, index) {\n                let box = null;\n                if (note.shape === \"rect\") {\n                    box = document.createElement(\"div\");\n                    box.className = \"html-annotation-export-box\";\n                    place(box, note, false);\n                    box.style.width = Math.max(0, Number(note.width || 0)) + \"px\";\n                    box.style.height = Math.max(0, Number(note.height || 0)) + \"px\";\n                    layer.appendChild(box);\n                }\n\n                const pin = document.createElement(\"button\");\n                pin.type = \"button\";\n                pin.className = \"html-annotation-export-pin\";\n                pin.textContent = index + 1;\n                place(pin, note, true);\n                bindTooltip(pin, note, index);\n                layer.appendChild(pin);\n                entries.push({ note: note, pin: pin, box: box });\n            });\n\n            function refreshVisibility() {\n                entries.forEach(function (entry) {\n                    placeEntry(entry);\n                    const covered = isCovered(entry.note);\n                    entry.pin.classList.toggle(\"html-annotation-export-hidden\", covered);\n                    if (entry.box) {\n                        entry.box.classList.toggle(\"html-annotation-export-hidden\", covered);\n                    }\n                    if (covered && (document.activeElement === entry.pin || activeTooltipAnchor === entry.pin)) {\n                        entry.pin.blur();\n                        hideTooltip();\n                    }\n                });\n            }\n\n            let refreshTimer = 0;\n            function scheduleRefresh() {\n                window.clearTimeout(refreshTimer);\n                refreshTimer = window.setTimeout(refreshVisibility, 80);\n            }\n\n            refreshVisibility();\n            window.addEventListener(\"scroll\", scheduleRefresh, true);\n            window.addEventListener(\"resize\", scheduleRefresh);\n y":12,"anchorRect":{"left":0,"top":0,"width":100,"height":100}},{"id":"ai-note-10","title":"需要关注","anchorPath":"#attentionSection","stage":"result","points":["展示需要处理或推荐复核的事项。","展示本次材料异常。"],"description":"展示需要处理或推荐复核的事项。\n展示本次材料异常。","type":"逻辑","shape":"point","positionMode":"viewport","x":96,"y":12,"anchorRect":{"left":0,"top":0,"width":100,"height":100}},{"id":"ai-note-11","title":"打开复核页","anchorPath":"#reviewLinks","stage":"result","points":["每种作业有独立的 HTML 复核页。","有多份作业时，分别展示各自独立的复核页打开入口。","同一作业下聚合多名学生作答。","点击后在当前页面右侧打开。"],"description":"每种作业有独立的 HTML 复核页。\n有多份作业时，分别展示各自独立的复核页打开入口。\n同一作业下聚合多名学生作答。\n点击后在当前页面右侧打开。","type":"逻辑","shape":"point","positionMode":"viewport","x":96,"y":12,"anchorRect":{"left":0,"top":0,"width":100,"height":100}},{"id":"ai-note-12","title":"复核工作区","anchorPath":"#reviewPane","stage":"review","points":["支持按题、按学生查看作答和批改结果。","老师可以修改批改判断。","生成的 HTML 文件保存在本地，支持持续更新。","老师修改批改结果后，同步更新本地文件。","下载和 Agent 读取均使用最新的本地文件。","支持下载已批改作业。","关闭复核区后可继续当前对话。"],"description":"支持按题、按学生查看作答和批改结果。\n老师可以修改批改判断。\n生成的 HTML 文件保存在本地，支持持续更新。\n老师修改批改结果后，同步更新本地文件。\n下载和 Agent 读取均使用最新的本地文件。\n支持下载已批改作业。\n关闭复核区后可继续当前对话。","type":"逻辑","shape":"point","positionMode":"viewport","x":96,"y":12,"anchorRect":{"left":0,"top":0,"width":100,"height":100}},{"id":"ai-note-13","title":"持续对话","anchorPath":"#taskComposerHost","stage":"result","points":["处理和复核过程中保留输入框，可继续输入对话。","切换复核区保留未发送的文字与附件。","可在对话中指定根据修改后的批改结果发起错因诊断或个性化练习。"],"description":"处理和复核过程中保留输入框，可继续输入对话。\n切换复核区保留未发送的文字与附件。\n可在对话中指定根据修改后的批改结果发起错因诊断或个性化练习。","type":"逻辑","shape":"point","positionMode":"viewport","x":96,"y":12,"anchorRect":{"left":0,"top":0,"width":100,"height":100}}]}</script><script>
const {source,annotations}=JSON.parse(document.getElementById('review-data').textContent);const frame=document.getElementById('demo');const cards=[];
annotations.forEach((n,i)=>{const card=document.createElement('section');card.className='note';card.tabIndex=0;const h=document.createElement('h3');const badge=document.createElement('span');badge.className='number';badge.textContent=i+1;h.append(badge,document.createTextNode(n.title));const list=document.createElement('ul');list.style.cssText='margin:0;padding-left:18px;font-size:13px;color:#586d62';n.points.forEach(point=>{const item=document.createElement('li');item.style.margin='6px 0';item.textContent=point;list.append(item)});card.append(h,list);card.onclick=()=>navigate(n.stage,i);card.onkeydown=e=>{if(e.key==='Enter')navigate(n.stage,i)};document.getElementById('notes').append(card);cards.push(card)});
function select(i){cards.forEach((c,j)=>c.classList.toggle('active',j===i));cards[i]?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function navigate(stage,index){frame.contentWindow.staticNavigate(stage);if(index!=null)select(index)}
function attach(){const d=frame.contentDocument;if(!d)return;let layer=d.querySelector('#html-annotation-export-layer');if(!layer){const temp=new DOMParser().parseFromString(source,'text/html');d.head.append(temp.querySelector('#html-annotation-export-style').cloneNode(true));const script=d.createElement('script');script.textContent=temp.querySelector('#html-annotation-export-script').textContent;d.body.append(script)}
const message=d.querySelector('#userMessage');if(message&&!message.textContent.trim())message.textContent='请帮我批改这两位学生的作业，在原作业上标注对错，汇总批改结果，并生成可复核的页面。';
const style=d.createElement('style');style.textContent='.html-annotation-export-pin{background:#ed9a36!important;color:white!important;border:2px solid white!important}#html-annotation-export-tooltip{display:none!important}';d.head.append(style);d.querySelectorAll('.html-annotation-export-pin').forEach((pin,i)=>pin.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();select(i)}));
if(frame.dataset.pending){const stage=frame.dataset.pending;const index=frame.dataset.note;delete frame.dataset.pending;let tries=0;const wait=setInterval(()=>{const button=d.querySelector('.review-link-button');if(button||++tries>60){clearInterval(wait);if(stage==='review')button?.click();if(index!=='')select(Number(index))}},100)}
}
frame.addEventListener('load',attach);frame.srcdoc=source;
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>navigate(b.dataset.stage));document.getElementById('toggle').onclick=()=>{const hidden=document.body.classList.toggle('demo-only');document.getElementById('toggle').textContent=hidden?'显示标注':'隐藏标注';const layer=frame.contentDocument?.querySelector('#html-annotation-export-layer');if(layer)layer.style.display=hidden?'none':''};
</script></html>
